# Render Blueprint. In the Render dashboard: New + → "Blueprint", point it at this
# repo, and it reads this file. (Or create a Web Service manually and use the
# build/start commands below.)
services:
  - type: web
    name: mc-marker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
